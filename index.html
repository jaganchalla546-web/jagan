<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-A-Mole: Arcade Edition</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --danger: #d63031;
            --gold: #fdcb6e;
            --bg-dark: #0f0c20;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0f0c20, #15102a, #241442, #0f0c20);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            font-size: 3rem;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(108, 92, 231, 0.6), 0 0 20px rgba(0, 206, 201, 0.4);
            text-align: center;
        }

        /* Glassmorphism Dashboard */
        .dashboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .stat-box {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-val {
            font-size: 2rem;
            color: var(--secondary);
        }
        
        #high-score-val { color: var(--gold); }
        #timer-val { color: var(--danger); }

        /* Progress Bar Timer */
        .timer-bar-container {
            width: 400px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .timer-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            transition: width 1s linear;
        }

        /* Game Board Layout */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 140px);
            grid-gap: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hole {
            width: 140px;
            height: 140px;
            background: #2d1f38;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 6px solid #4a375a;
            box-shadow: inset 0 12px 0 rgba(0,0,0,0.6), 0 8px 15px rgba(0,0,0,0.4);
        }

        /* The Entity Base */
        .entity {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 100%; 
            transition: top 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .entity.up {
            top: 15%;
        }

        /* Entity Variants via Data Attributes */
        .entity[data-type="mole"] {
            background: radial-gradient(circle at 30% 30%, #e67e22, #d35400);
        }
        .entity[data-type="mole"]::before { content: '🐹'; font-size: 55px; }

        .entity[data-type="golden"] {
            background: radial-gradient(circle at 30% 30%, #ffeaa7, #fdcb6e);
            box-shadow: 0 0 20px #fdcb6e;
        }
        .entity[data-type="golden"]::before { content: '👑'; font-size: 55px; }

        .entity[data-type="bomb"] {
            background: radial-gradient(circle at 30% 30%, #555, #222);
        }
        .entity[data-type="bomb"]::before { content: '💣'; font-size: 55px; }

        /* Controls */
        #start-btn {
            margin-top: 30px;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
            transition: all 0.3s ease;
        }

        #start-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.6);
        }

        #start-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        #start-btn:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Whack & Damage FX animations */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-10px, 10px); }
            40%, 80% { transform: translate(10px, -10px); }
        }
        .shake-screen {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <h1>ANGRY NINJA</h1>

    <div class="dashboard">
        <div class="stat-box">Score <span id="score-val" class="stat-val">0</span></div>
        <div class="stat-box">High Score <span id="high-score-val" class="stat-val">0</span></div>
        <div class="stat-box">Time Left <span id="timer-val" class="stat-val">20s</span></div>
    </div>

    <div class="timer-bar-container">
        <div id="timer-bar" class="timer-bar"></div>
    </div>
    
    <div class="game-grid">
        <div class="hole"><div class="entity" data-type="mole"></div></div>
        <div class="hole"><div class="entity" data-type="mole"></div></div>
        <div class="hole"><div class="entity" data-type="mole"></div></div>
        <div class="hole"><div class="entity" data-type="mole"></div></div>
        <div class="hole"><div class="entity" data-type="mole"></div></div>
        <div class="hole"><div class="entity" data-type="mole"></div></div>
        <div class="hole"><div class="entity" data-type="mole"></div></div>
        <div class="hole"><div class="entity" data-type="mole"></div></div>
        <div class="hole"><div class="entity" data-type="mole"></div></div>
    </div>

    <button id="start-btn">START GAME</button>

    <script>
        const holes = document.querySelectorAll('.hole');
        const entities = document.querySelectorAll('.entity');
        const scoreDisplay = document.querySelector('#score-val');
        const highScoreDisplay = document.querySelector('#high-score-val');
        const timerDisplay = document.querySelector('#timer-val');
        const timerBar = document.querySelector('#timer-bar');
        const startBtn = document.querySelector('#start-btn');
        
        let lastHole;
        let score = 0;
        let highScore = localStorage.getItem('whackHighScore') || 0;
        let gameTimeUp = false;
        let gameCountdown;
        let totalGameTime = 20; // 20-second match duration
        let timeLeft = totalGameTime;
        
        // Native Web Audio Synthesizer (No external sound asset dependencies)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'whack') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'bomb') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'gameover') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        highScoreDisplay.textContent = highScore;

        function randomTime(min, max) {
            // Scale step timing based on modern difficulty scaling curve
            const difficultyMultiplier = Math.max(0.4, 1 - (score * 0.04));
            return Math.round((Math.random() * (max - min) + min) * difficultyMultiplier);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) return randomHole(holes);
            lastHole = hole;
            return hole;
        }

        function peep() {
            const hole = randomHole(holes);
            const entity = hole.querySelector('.entity');
            
            // Randomly configure entity type: 65% Normal Mole, 15% Golden Mole, 20% Bomb
            const randType = Math.random();
            let currentType = 'mole';
            let stayTime = randomTime(700, 1300);

            if (randType > 0.85) {
                currentType = 'golden';
                stayTime = randomTime(400, 700); // Golden moles vanish faster!
            } else if (randType > 0.65) {
                currentType = 'bomb';
                stayTime = randomTime(800, 1400);
            }

            entity.setAttribute('data-type', currentType);
            entity.classList.add('up');

            setTimeout(() => {
                entity.classList.remove('up');
                if (!gameTimeUp) peep();
            }, stayTime);
        }

        function startTimer() {
            timeLeft = totalGameTime;
            timerDisplay.textContent = `${timeLeft}s`;
            timerBar.style.width = '100%';

            gameCountdown = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `${timeLeft}s`;
                timerBar.style.width = `${(timeLeft / totalGameTime) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(gameCountdown);
                    endGame();
                }
            }, 1000);
        }

        function startGame() {
            score = 0;
            scoreDisplay.textContent = score;
            gameTimeUp = false;
            startBtn.disabled = true;
            startBtn.textContent = "PLAYING...";
            
            startTimer();
            peep();
        }

        function endGame() {
            gameTimeUp = true;
            startBtn.disabled = false;
            startBtn.textContent = "START GAME";
            playSound('gameover');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('whackHighScore', highScore);
                highScoreDisplay.textContent = highScore;
                alert(`🎉 Incredible! NEW High Score: ${score}!`);
            } else {
                alert(`Game Over! Final Score: ${score}`);
            }
        }

        function whack(e) {
            if(!e.isTrusted) return; // Prevent cheat scripts
            if(!this.classList.contains('up')) return; // Avoid multi-clicking disappearing items

            const type = this.getAttribute('data-type');
            this.classList.remove('up');

            if (type === 'mole') {
                score += 1;
                playSound('whack');
            } else if (type === 'golden') {
                score += 3;
                playSound('whack');
            } else if (type === 'bomb') {
                score = Math.max(0, score - 2); // Avoid negative points
                playSound('bomb');
                // Trigger screen-shake on striking an obstacle
                document.body.classList.add('shake-screen');
                setTimeout(() => document.body.classList.remove('shake-screen'), 400);
            }

            scoreDisplay.textContent = score;
        }

        startBtn.addEventListener('click', startGame);
        entities.forEach(entity => entity.addEventListener('click', whack));
    </script>
</body>
</html>
